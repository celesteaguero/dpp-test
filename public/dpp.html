<template x-if="d"><main id="main" tabindex="-1"><header>

<details class="card gl"><summary>Glosario de siglas y términos</summary><dl><dt>GTIN</dt><dd>Número mundial de artículo comercial: el código de barras del producto.</dd><dt>SKU</dt><dd>Referencia interna con la que la empresa identifica el producto.</dd><dt>UID</dt><dd>Identificador único: un código que no se repite.</dd><dt>ESPR</dt><dd>Reglamento europeo de ecodiseño para productos sostenibles.</dd><dt>CSRD</dt><dd>Directiva europea de información corporativa sobre sostenibilidad.</dd><dt>EUDR</dt><dd>Reglamento europeo contra la deforestación.</dd><dt>SVHC</dt><dd>Sustancias químicas extremadamente preocupantes según la normativa REACH.</dd><dt>REACH</dt><dd>Reglamento europeo sobre registro, evaluación y autorización de sustancias químicas.</dd><dt>LCA</dt><dd>Análisis de ciclo de vida: mide el impacto ambiental de un producto desde su origen hasta su fin de vida.</dd><dt>GOTS</dt><dd>Estándar Textil Orgánico Global.</dd><dt>GRS</dt><dd>Estándar de Reciclaje Global.</dd><dt>BCI</dt><dd>Better Cotton Initiative: iniciativa para producir algodón de forma más sostenible.</dd><dt>TC</dt><dd>Transaction Certificate: certificado que confirma cada venta de material certificado.</dd><dt>QR</dt><dd>Código de respuesta rápida: se escanea con el móvil.</dd><dt>ERP</dt><dd>Sistema informático de gestión de la empresa.</dd><dt>kWh</dt><dd>Kilovatio hora: unidad de energía.</dd><dt>CO₂eq</dt><dd>Dióxido de carbono equivalente: medida de gases de efecto invernadero.</dd><dt>UE</dt><dd>Unión Europea.</dd></dl></details><footer><p><small>Conforme al Reglamento (UE) 2024/1781 (ESPR). CSRD: <span x-text="d.a.csrd?'aplica':'no aplica'"></span> · EUDR: <span x-text="d.a.eudr?'aplica':'no aplica'"></span></small></p>
